<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Farmley Auto Refresh</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-6">

            <div class="card shadow">

                <div class="card-body p-4">

                    <h2 class="text-center mb-4">
                        🌰 Farmley Auto Refresh
                    </h2>

                    <form method="POST">

                        <div class="mb-3">

                            <label class="form-label">

                                Start Date

                            </label>

                            <input
                                type="date"
                                class="form-control"
                                name="start_date"
                                required
                            >

                        </div>

                        <div class="mb-4">

                            <label class="form-label">

                                End Date

                            </label>

                            <input
                                type="date"
                                class="form-control"
                                name="end_date"
                                required
                            >

                        </div>

                        <button
                            class="btn btn-success w-100"
                            type="submit">

                            Refresh Reports

                        </button>

                    </form>

                    {% if completed %}

                    <hr>

                    <h4 class="mb-3">

                        Results

                    </h4>

                    <table class="table table-bordered">

                        <thead>

                        <tr>

                            <th>Report</th>
                            <th>Status</th>
                            <th>Time</th>

                        </tr>

                        </thead>

                        <tbody>

                        {% for r in results %}

                        <tr>

                            <td>{{ r.name }}</td>

                            <td>{{ r.status }}</td>

                            <td>{{ r.time }}</td>

                        </tr>

                        {% endfor %}

                        </tbody>

                    </table>

                    <div class="alert alert-success">

                        Total Time :
                        <strong>{{ total_time }}</strong>

                    </div>

                    {% endif %}

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
