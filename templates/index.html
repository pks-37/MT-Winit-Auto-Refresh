<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Winit Reports Update</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <link rel="manifest" 
        href="{{ url_for('static', filename='manifest.json') }}">

    <meta name="theme-color" content="#ffc83d">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>
        body {
            background: #0f1115;
            color: #f5f5f5;
            min-height: 100vh;
        }

        .main-card {
            background: #181b21;
            border: 1px solid #2b3038;
            border-radius: 16px;
        }

        .title {
            color: #ffffff;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: #9da4ae;
            font-size: 14px;
            line-height: 1.5;
        }

        .form-label {
            color: #e7e9ec;
            font-weight: 500;
        }

        .form-control {
            background: #111318;
            border: 1px solid #363c45;
            color: #ffffff;
            border-radius: 8px;
            height: 48px;
        }

        .form-control:focus {
            background: #111318;
            color: #ffffff;
            border-color: #ffc83d;
            box-shadow: 0 0 0 0.2rem rgba(255, 200, 61, 0.12);
        }

        .form-control::-webkit-calendar-picker-indicator {
            filter: invert(1);
            cursor: pointer;
        }

        .refresh-btn {
            background: #ffc83d;
            border: none;
            color: #17213a;
            font-weight: 600;
            height: 48px;
            border-radius: 8px;
        }

        .refresh-btn:hover {
            background: #ffd45f;
            color: #17213a;
        }

        .divider {
            border-color: #2b3038;
            opacity: 1;
        }

        .results-title {
            color: #ffffff;
            font-weight: 600;
        }

        .table {
            --bs-table-bg: #111318;
            --bs-table-color: #e7e9ec;
            --bs-table-border-color: #2f353e;
            margin-bottom: 0;
        }

        .table th {
            color: #aeb5bf;
            font-size: 13px;
            font-weight: 600;
        }

        .table td {
            vertical-align: middle;
        }

        .success-box {
            background: #17251f;
            border: 1px solid #28523f;
            color: #d7f5e5;
            border-radius: 8px;
        }

        .logo {
            width: 140px;
            height: auto;
        }
    </style>
</head>


<body>

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-6 col-md-8 col-12">

            <div class="main-card shadow-lg">

                <div class="card-body p-4 p-md-5">


                    <!-- HEADER -->

                    <div class="text-center mb-4">

                        <img
                            src="{{ url_for('static', filename='farmley-logo.png') }}"
                            alt="Farmley"
                            class="logo"
                        >

                        <h2 class="title mt-4 mb-0">
                            Winit Reports Update
                        </h2>

                    </div>


                    <!-- DESCRIPTION -->

                    <p class="subtitle mb-4">
                        Choose the date range for the data to be refreshed
                        in the backend Google Sheet.
                    </p>


                    <!-- FORM -->

                    <form method="POST">

                        <div class="mb-3">

                            <label class="form-label mb-2">
                                Start Date
                            </label>

                            <input
                                type="date"
                                class="form-control"
                                name="start_date"
                                required
                            >

                        </div>


                        <div class="mb-4">

                            <label class="form-label mb-2">
                                End Date
                            </label>

                            <input
                                type="date"
                                class="form-control"
                                name="end_date"
                                required
                            >

                        </div>


                        <button
                            class="refresh-btn w-100"
                            type="submit">

                            Refresh Reports

                        </button>

                    </form>


                    <!-- RESULTS -->

                    {% if completed %}

                    <hr class="divider my-4">

                    <h5 class="results-title mb-3">
                        Results
                    </h5>


                    <div class="table-responsive">

                        <table class="table table-bordered">

                            <thead>

                            <tr>

                                <th>
                                    Report
                                </th>

                                <th>
                                    Status
                                </th>

                                <th>
                                    Time
                                </th>

                            </tr>

                            </thead>


                            <tbody>

                            {% for r in results %}

                            <tr>

                                <td>
                                    {{ r.name }}
                                </td>

                                <td>
                                    {{ r.status }}
                                </td>

                                <td>
                                    {{ r.time }}
                                </td>

                            </tr>

                            {% endfor %}

                            </tbody>

                        </table>

                    </div>


                    <div class="success-box p-3 mt-3">

                        Total Time :
                        <strong>{{ total_time }}</strong>

                    </div>

                    {% endif %}


                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
